[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "welding-kg"
version = "0.1.0"
description = "焊接知识图谱最简原型：案例检索 → 需求差异 → 图谱多跳路径 → LLM 路径选择 → 修正量生成"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "neo4j>=5.20",
    # 代码面向 OpenAI 3.x（使用 httpx2 作为底层 HTTP 客户端），
    # 必须显式约束主版本并声明 httpx2 为直接依赖，不得依赖传递依赖偶然可运行
    "openai>=3.0,<4",
    "httpx2>=2.0,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试分组（验收规范 §四）：
#   unit        纯函数与 FakeStore 测试，无外部服务也必须全部通过
#   integration 真实 Neo4j/BGE/LLM 测试，正式验收时不得跳过
markers = [
    "integration: 需要真实 Neo4j/BGE/LLM 服务的集成测试",
]
